  allow_structurally_adaptable: true
  minimum_main_claim_coverage: 0.85
benchmark_prior:
  preferred_main_figure_count: 4
  preferred_panel_count_range:
  - 2
  - 4
  preferred_schematic_fraction_range:
  - 0.1
  - 0.3
  preferred_evidence_sequence:
  - design
  - anchor
  - participant
  - robustness
  - external_context
journal_constraints:
  max_main_displays: 5
panel_inventory_tsv: panels.tsv
