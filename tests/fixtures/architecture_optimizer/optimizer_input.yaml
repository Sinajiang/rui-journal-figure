project:
  title: Synthetic
  target_journal: Headache
  scientific_authority: v1
  manuscript_authority: m1
claims:
  C001:
    priority: 10
    must_cover_main: true
  C002:
    priority: 8
    must_cover_main: false
  C003:
    priority: 9
    must_cover_main: true
  C004:
    priority: 2
    must_cover_main: false
constraints:
  figure_count_min: 3
  figure_count_max: 5
  max_panels_per_figure: 4
  max_visual_density_per_figure: 24
